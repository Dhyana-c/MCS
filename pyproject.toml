[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcs-core"
version = "0.1.0"
description = "MCS (Maximum-Context Subgraph) — LLM-native knowledge graph engine"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    {name = "MCS Team"},
]
license = {text = "MIT"}
dependencies = [
    "openai>=1.0,<2.0",
    "jieba>=0.42",
    "ujson>=5.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "httpx>=0.27",
]
claude = [
    "anthropic>=0.40,<1.0",
]
yaml = [
    "pyyaml>=6",
]
mcp = [
    "mcp>=1.0",
    "pyyaml>=6",
]
agent = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2",
]

[project.scripts]
mcs-mcp = "mcs_mcp.server:main"
mcs-agent = "mcs_agent.app:run [agent]"

[tool.setuptools.packages.find]
include = ["mcs*", "mcs_mcp*", "mcs_agent*"]
exclude = ["tests*", "examples*"]

# 前端静态资源随 mcs_agent 包发货（StaticFiles mount 依赖）；缺此则 wheel 不含 index.html、`/` 路由 404。
# 用 ** 递归 glob：覆盖 static/ 直接文件 + 任意深度子目录（setuptools>=68 实测递归有效）。
[tool.setuptools.package-data]
mcs_agent = ["static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]
